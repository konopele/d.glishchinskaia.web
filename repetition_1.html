<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DARIA GLISHCHINSKAIA</title>

  <style>
    :root{
      --bg:#fff;
      --fg:#000;

      --top-gap:46px;     /* space above photos for dots */
      --dot-size:5px;
      --dot-gap:6px;
      --dot-shift:-10px;  /* negative = shift left */

      --edge-zone:80px;   /* px near left/right edges that triggers scrolling */
      --max-speed:18;     /* px per frame */
      --page-pad:0px;     /* keep 0 for flush look */
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

:root{
  /* ... */
  --side-pad: 56px; /* distance from left/right borders */
  --top-pad: 0px;   /* keep 0 unless you also want top/bottom padding */
}

/* Whole stage (no frame) */
.stage{
  position: fixed;
  top: var(--top-pad);
  bottom: var(--top-pad);
  left: var(--side-pad);
  right: var(--side-pad);
  background: var(--bg);
  overflow: hidden;
}


.menu-link{
  position: fixed;
  top: 12px;

  /* 1/4 of the page width */
  left: 25%;

  /* keep the small left shift you already liked */
  transform: translateX(var(--dot-shift));

  z-index: 10;
  padding: 8px 12px;
  text-decoration: none;

  /* slight blur */
  filter: blur(0.65px);
  opacity: 0.8;
  
  -webkit-tap-highlight-color: transparent;
}

/* kill the default dotted focus outline that can look like tiny blinking dots */
.menu-link:focus-visible{
  outline: 2px solid #000;
  outline-offset: 6px;
}

/* Remove the stray pseudo-element that creates the tiny extra dots */
.dots::before,
.dots::after{
  content: none !important;
  display: none !important;
}

/* (Optional) also prevent pseudo-elements on the link itself */
.menu-link::before,
.menu-link::after{
  content: none !important;
  display: none !important;
}



    .dots{ display:flex; gap: var(--dot-gap); }
    .dot{
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--fg); /* black dots */
      opacity: 0.9;
    }
    .menu-link:focus-visible{
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }

    /* Reserve top band, photos below */
    .viewport{
      position:absolute;
      inset: 0;
      padding-top: var(--top-gap);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Scrolling strip */
    .strip{
      height: calc(100% - var(--top-gap));
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0; /* no gaps */
      will-change: transform;
      transform: translate3d(0,0,0);
    }

    .strip img{
      display: block;
      height: 100%;
      width: auto;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- Dots link to menu.html -->
  <a class="menu-link" href="menu.html" aria-label="Open menu">
    <span class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span>
  </a>

  <div class="stage" id="stage">
    <div class="viewport">
      <div class="strip" id="strip">
        <!-- Replace paths with your actual images -->
        <img src="front/01.jpg" alt="">
        <img src="front/02.jpg" alt="">
        <img src="front/03.jpg" alt="">
        <img src="front/04.jpg" alt="">
        <img src="front/05.jpg" alt="">
        <img src="front/06.jpg" alt="">
        <img src="front/07.jpg" alt="">
        <img src="front/08.jpg" alt="">
      </div>
    </div>
  </div>

  <script>
    const strip = document.getElementById('strip');

    // --- Horizontal auto-scroll by pointer near page borders ---
    let x = 0;
    let vx = 0;
    let mouseX = window.innerWidth / 2;

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function bounds(){
      const viewportW = document.documentElement.clientWidth;
      const stripW = strip.scrollWidth;
      const minX = Math.min(0, viewportW - stripW);
      const maxX = 0;
      return { minX, maxX };
    }

    function tick(){
      const styles = getComputedStyle(document.documentElement);
      const edgeZone = parseFloat(styles.getPropertyValue('--edge-zone')) || 80;
      const maxSpeed = parseFloat(styles.getPropertyValue('--max-speed')) || 18;

      const w = window.innerWidth;
      let targetV = 0;

      if (mouseX < edgeZone){
        const t = 1 - (mouseX / edgeZone);
        targetV = maxSpeed * t;      // move right
      } else if (mouseX > w - edgeZone){
        const t = 1 - ((w - mouseX) / edgeZone);
        targetV = -maxSpeed * t;     // move left
      }

      vx += (targetV - vx) * 0.15;
      x += vx;

      const { minX, maxX } = bounds();
      x = clamp(x, minX, maxX);

      strip.style.transform = `translate3d(${x}px,0,0)`;
      requestAnimationFrame(tick);
    }

    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; });

    window.addEventListener('resize', () => {
      const { minX, maxX } = bounds();
      x = clamp(x, minX, maxX);
      strip.style.transform = `translate3d(${x}px,0,0)`;
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
