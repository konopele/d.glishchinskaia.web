<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>спорт-клуб</title>

  <style>
    /* 1) Load YOUR font (put Montserrat-SemiBoldItalic.ttf in the same folder as this HTML) */
    @font-face {
      font-family: "Montserrat-ThinItalic";
      src: url("./fonts/montserrat/Montserrat-ThinItalic.ttf") format("truetype");
      font-weight: 600;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --ink: #111;
      --bg: #fff;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    /* 2) Full-viewport page (NO centering/scaling wrappers) */
    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
    }

    /* 3) Shared text style */
    .t {
      position: absolute;
      font-family: "Montserrat-ThinItalic", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-weight: 600;
      font-style: italic;
      color: var(--ink);
      line-height: 1;
      white-space: nowrap;

      /* keep it clean/sharp-ish */
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: auto;
      -moz-osx-font-smoothing: auto;
    }

    /*
      4) Positions (pixel-locked)
      These are from your reference image coordinate system.
      If you want them slightly more left/up, just decrease left/top values.
    */

    /* "спорт-клуб" */
    .title {
      left: 70%;
      top: 157px;
      font-size: 28px;
    }

    /* "txt" */
    .mid {
      left: 198px;
      top: 45%;
      font-size: 22px;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="t title">спорт-клуб</div>
    <div class="t mid">txt</div>
  </div>
</body>
</html>
