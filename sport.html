  <style>
    :root{
      --bg:#fff;
      --fg:#000;

      --top-gap:46px;     /* space above photos for dots */
      --dot-size:5px;
      --dot-gap:6px;
      --dot-shift:-10px;  /* negative = shift left */

      --edge-zone:80px;   /* px near left/right edges that triggers scrolling */
      --max-speed:18;     /* px per frame */
      --page-pad:0px;     /* keep 0 for flush look */
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

:root{
  /* ... */
  --side-pad: 56px; /* distance from left/right borders */
  --top-pad: 0px;   /* keep 0 unless you also want top/bottom padding */
}

/* Whole stage (no frame) */
.stage{
  position: fixed;
  top: var(--top-pad);
  bottom: var(--top-pad);
  left: var(--side-pad);
  right: var(--side-pad);
  background: var(--bg);
  overflow: hidden;
}


.menu-link{
  position: fixed;
  top: 12px;

  /* 1/4 of the page width */
  left: 25%;

  /* keep the small left shift you already liked */
  transform: translateX(var(--dot-shift));

  z-index: 10;
  padding: 8px 12px;
  text-decoration: none;

  /* slight blur */
  filter: blur(0.65px);
  opacity: 0.8;
  
  -webkit-tap-highlight-color: transparent;
}

/* kill the default dotted focus outline that can look like tiny blinking dots */
.menu-link:focus-visible{
  outline: 2px solid #000;
  outline-offset: 6px;
}

/* Remove the stray pseudo-element that creates the tiny extra dots */
.dots::before,
.dots::after{
  content: none !important;
  display: none !important;
}

/* (Optional) also prevent pseudo-elements on the link itself */
.menu-link::before,
.menu-link::after{
  content: none !important;
  display: none !important;
}



    .dots{ display:flex; gap: var(--dot-gap); }
    .dot{
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--fg); /* black dots */
      opacity: 0.9;
    }
    .menu-link:focus-visible{
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }

    /* Reserve top band, photos below */
    .viewport{
      position:absolute;
      inset: 0;
      padding-top: var(--top-gap);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Scrolling strip */
    .strip{
      height: calc(100% - var(--top-gap));
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0; /* no gaps */
      will-change: transform;
      transform: translate3d(0,0,0);
    }

    .strip img{
      display: block;
      height: 100%;
      width: auto;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    /* ===== sport-club intro "page" ===== */
:root{
  /* tweak these 3 numbers if you want micro-adjustments */
  --intro-w: clamp(360px, 44vw, 520px);  /* keeps right image visible */
  --intro-x: 115px;                      /* left offset for text */
  --intro-title-y: 120px;                /* title vertical position */
  --intro-txt-y: 290px;                  /* txt vertical position */
  --intro-color: #7a7a7a;
}

/* viewport becomes stacking context */
.viewport{ position: absolute; inset:0; padding-top: var(--top-gap); overflow:hidden; }

/* Fixed text layer */
.intro-layer{
  position: absolute;            /* fixed relative to viewport */
  inset: 0;                      /* full area under top-gap */
  z-index: 0;                    /* behind strip */
  pointer-events: none;          /* don't block scrolling */
}

/* Strip stays above */
.strip{ position: relative; z-index: 1; }

/* Your text positions (match screenshot) */
.intro-layer .title{
  position: absolute;
  left: 115px;
  top: 120px;
  font-style: italic;
  color: #7a7a7a;
  font-size: 18px;
  line-height: 1;
  pointer-events: none;
}

.intro-layer .txt{

  font-size: 18px;

  background: transparent;
  border: 0;

  pointer-events: auto;          /* re-enable only for the button */
}

/* ===== txt modal (hidden by default) ===== */
.modal-backdrop{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;         /* IMPORTANT: hide by default */
  z-index: 50;
}

.modal-backdrop.open{ display: block; }

.modal{
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: min(560px, calc(100% - 28px));
  background: #fff;
  border-radius: 18px;
  padding: 18px 18px 14px 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  color:#111;
  font-style: normal;
}

.modal h3{
  margin: 0 0 8px 0;
  font-size: 16px;
  font-weight: 600;
}

.modal p{
  margin: 0 0 14px 0;
  color:#333;
  line-height: 1.4;
  font-size: 14px;

.modal .actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;

.btn{
  border: 1px solid rgba(0,0,0,.16);
  background: #fff;
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
}

.btn:hover{ background: rgba(0,0,0,.04); }

  <script>
    const strip = document.getElementById('strip');

    // --- Horizontal auto-scroll by pointer near page borders ---
    let x = 0;
    let vx = 0;
    let mouseX = window.innerWidth / 2;

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function bounds(){
      const viewportW = document.documentElement.clientWidth;
      const stripW = strip.scrollWidth;
      const minX = Math.min(0, viewportW - stripW);
      const maxX = 0;
      return { minX, maxX };
    }

    function tick(){
      const styles = getComputedStyle(document.documentElement);
      const edgeZone = parseFloat(styles.getPropertyValue('--edge-zone')) || 80;
      const maxSpeed = parseFloat(styles.getPropertyValue('--max-speed')) || 18;

      const w = window.innerWidth;
      let targetV = 0;

      if (mouseX < edgeZone){
        const t = 1 - (mouseX / edgeZone);
        targetV = maxSpeed * t;      // move right
      } else if (mouseX > w - edgeZone){
        const t = 1 - ((w - mouseX) / edgeZone);
        targetV = -maxSpeed * t;     // move left
      }

      vx += (targetV - vx) * 0.15;
      x += vx;

      const { minX, maxX } = bounds();
      x = clamp(x, minX, maxX);

      strip.style.transform = `translate3d(${x}px,0,0)`;
      requestAnimationFrame(tick);
    }

    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; });

    window.addEventListener('resize', () => {
      const { minX, maxX } = bounds();
      x = clamp(x, minX, maxX);
      strip.style.transform = `translate3d(${x}px,0,0)`;
    });

    requestAnimationFrame(tick);
    // --- txt modal toggle ---
const txtBtn = document.getElementById('txtBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalClose = document.getElementById('modalClose');

function openModal(open){
  modalBackdrop.classList.toggle('open', open);
  modalBackdrop.setAttribute('aria-hidden', String(!open));
}

txtBtn.addEventListener('click', () => openModal(true));
modalClose.addEventListener('click', () => openModal(false));
modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) openModal(false);
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') openModal(false);
});

  </script>
