  <style>
    /* Baseline responsive safety */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: hidden; }
img, video, svg { max-width: 100%; height: auto; }

/* Prevent common overflow from long strings */
p, h1, h2, h3, h4, h5, h6, a, li, span {
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Forms/buttons tap comfort */
button, input, select, textarea { font: inherit; }
button, a { touch-action: manipulation; }

  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Light.ttf") format("truetype");

}

    :root{
      --bg:#fff;
      --fg:#000;

      --top-gap:46px;     /* space above photos for dots */
      --dot-size:5px;
      --dot-gap:6px;
      --dot-shift:-10px;  /* negative = shift left */

      --edge-zone:80px;   /* px near left/right edges that triggers scrolling */
      --max-speed:18;     /* px per frame */
      --page-pad:0px;     /* keep 0 for flush look */
    }

body{
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
}

:root{
  --bg:#fff;
  --fg:#000;

  /* ✅ top white stripe height */
  --topbar-h:56px;

  /* keep using this as the reserved height above photos */
  --top-gap: var(--topbar-h);

  --dot-size:5px;
  --dot-gap:6px;
  --dot-shift:-10px;

  /* ✅ remove frames so content touches sides */
  --left-frame: 0px;
  --right-frame: 0px;

  --end-gap: 24px;
  --page-pad-top:0px;
  --page-pad:0px;
  --bottom-gap: 46px;  /* <- add this */
}

/* ✅ fixed top stripe, opaque, no border/frame */
.topbar{
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-h);
  background: var(--bg);
  z-index: 20;
}

/* ✅ stage must be positioned, and touch edges */
.viewport{
  position:absolute;
  inset: 0;
  padding-top: var(--top-gap);
  padding-bottom: var(--bottom-gap);   /* <- add */
  box-sizing: border-box;
  overflow: hidden;
  touch-action: pan-x;
}

.strip{
  height: calc(100% - var(--top-gap) - var(--bottom-gap));  /* <- change */
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 0;
  will-change: transform;
  transform: translate3d(0,0,0);
}

/* ✅ menu-link anchored inside the stripe */
.menu-link{
  position: fixed;
  top: calc(var(--topbar-h) / 2);
  left: 98%;
  transform: translate(-50%, -50%) translateX(var(--dot-shift));
  z-index: 30; /* above stripe */
  padding: 8px 12px;
  text-decoration: none;
  filter: blur(3.25px);
  -webkit-tap-highlight-color: transparent;
}

.intro-panel{
  flex: 0 0 500px;
  height: 100%;
  background: var(--bg);
  position: relative;   /* ✅ for absolute-positioned text */
  box-sizing: border-box;
}

.intro-title{ /* здесь ты стайлишь надпись фронтир */
  /* MOVE TITLE HERE */
  position: absolute;
  top: var(--intro-top);
  left: 45%;
  top: 25%;
  
  /* CHANGE TITLE FONT STYLING HERE */
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.08em;
  font-weight: 400;
  opacity: 0.75;
  font-style: italic;
}

.intro-txt{ /* здесь ты стайлишь надпись txt */
  /* MOVE txt HERE */
  position: absolute;
  top: 50%;
  left: 30%;

  /* CHANGE txt FONT STYLING HERE */
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg);
  padding: 0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.02em;
  font-weight: 400;
  opacity: 0.55;
  cursor: pointer;
  font-style: italic;
}


/* kill the default dotted focus outline that can look like tiny blinking dots */
.menu-link:focus-visible{
  outline: 2px solid #000;
  outline-offset: 6px;
}

/* Remove the stray pseudo-element that creates the tiny extra dots */
.dots::before,
.dots::after{
  content: none !important;
  display: none !important;
}

/* (Optional) also prevent pseudo-elements on the link itself */
.menu-link::before,
.menu-link::after{
  content: none !important;
  display: none !important;
}



    .dots{ display:flex; gap: var(--dot-gap); }
    .dot{
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--fg); /* black dots */
      opacity: 0.9;
    }
    .menu-link:focus-visible{
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }



    /* Scrolling strip */
.strip{
  height: 100%;
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 0;
  will-change: transform;
  transform: translate3d(0,0,0);
  align-items: stretch;
}

.start-spacer,
.end-spacer{
  flex: 0 0 var(--end-gap);
  height: 100%;
}

    .strip img{
      display: block;
      height: 100%;
      width: auto;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ===== photo framing like your screenshots ===== */

/* stop forcing full-height cropped images */
.strip img{
  height: auto !important;
  width: auto !important;
  object-fit: contain !important;
  pointer-events: none;
}

.item{
  height: 100%;
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 28px 36px;

  box-sizing: border-box;   /* ✅ IMPORTANT: prevents “falling down” */
}

/* the image scales down to fit the cell, no cropping */
.item > img{
  max-height: 100%;
  max-width: 100%;
  display: block;
}

.item.large{ padding: 14px 20px; } /* less padding = bigger photo */
.item.small{ padding: 90px 92px; } /* more padding = smaller photo */

<script>
  const strip = document.getElementById('strip');
  const stage = document.getElementById('stage');

  let x = 0;

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  // ✅ bounds based on the visible stage, not the full window
  function bounds(){
    const stageW = stage.clientWidth;
    const stripW = strip.scrollWidth; // includes padding-right end-gap
    const minX = Math.min(0, stageW - stripW); // farthest left you can go
    const maxX = 0;                             // flush left, never any left gap
    return { minX, maxX };
  }

  function apply(){
    const { minX, maxX } = bounds();
    x = clamp(x, minX, maxX);
    strip.style.transform = `translate3d(${x}px,0,0)`;
  }

  // ✅ wheel-only scroll
  window.addEventListener('wheel', (e) => {
    // use vertical as primary (mouse wheel), fall back to deltaX (trackpad)
    const delta = (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) ? e.deltaY : e.deltaX;

    const speed = 1.2; // tune
    x -= delta * speed;

    apply();
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('resize', apply);
  window.addEventListener('load', () => { x = 0; apply(); });

  // -------------------------
  // keep your modal code below (UNCHANGED)
  // -------------------------

  const txtBtn = document.getElementById('txtBtn');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalClose = document.getElementById('modalClose');

  function openModal(open){
    modalBackdrop.classList.toggle('open', open);
    modalBackdrop.setAttribute('aria-hidden', String(!open));
  }

  txtBtn.addEventListener('click', () => openModal(true));
  modalClose.addEventListener('click', () => openModal(false));
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) openModal(false);
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') openModal(false);
  });

  // ===== Mobile: touch drag + inertia for the strip =====
let isPointerDown = false;
let lastX = 0;
let lastT = 0;
let dragV = 0;        // px per frame-ish (we'll compute from time)
let dragging = false;

function getClientX(e){
  if (e.touches && e.touches.length) return e.touches[0].clientX;
  if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
  return e.clientX;
}

function onDown(e){
  isPointerDown = true;
  dragging = true;
  lastX = getClientX(e);
  lastT = performance.now();
  dragV = 0;
}

function onMove(e){
  if (!isPointerDown) return;

  const cx = getClientX(e);
  const now = performance.now();
  const dx = cx - lastX;
  const dt = Math.max(1, now - lastT);

  // Move strip with finger
  x += dx;

  // Estimate velocity (px/ms)
  dragV = dx / dt;

  lastX = cx;
  lastT = now;

  const { minX, maxX } = bounds();
  x = clamp(x, minX, maxX);

  strip.style.transform = `translate3d(${x}px,0,0)`;
}

function onUp(){
  if (!isPointerDown) return;
  isPointerDown = false;

  // Convert px/ms to your vx (px/frame at ~60fps)
  vx = dragV * 16.67;     // inertia
  dragging = false;
}

// Use Pointer Events when available (covers touch + pen + mouse)
if (window.PointerEvent){
  strip.addEventListener('pointerdown', (e) => {
    // only primary finger
    if (e.pointerType === 'mouse') return; // mouse handled by edge-hover
    strip.setPointerCapture(e.pointerId);
    onDown(e);
  });

  strip.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') return;
    onMove(e);
  });

  strip.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse') return;
    onUp();
  });

  strip.addEventListener('pointercancel', onUp);
} else {
  // Fallback touch events
  strip.addEventListener('touchstart', onDown, { passive: true });
  strip.addEventListener('touchmove', onMove, { passive: true });
  strip.addEventListener('touchend', onUp, { passive: true });
  strip.addEventListener('touchcancel', onUp, { passive: true });
}

// ===== Modify your tick() slightly: don’t edge-scroll while dragging =====
// Put this ONE LINE inside tick() right after you compute targetV:
/// if (dragging) targetV = 0;
</script>
