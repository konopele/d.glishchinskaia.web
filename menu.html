<style>
  /* Load Montserrat (local files) */
  @font-face{
    font-family: "Montserrat";
    src: url("/fonts/montserrat/Montserrat-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face{
    font-family: "Montserrat";
    src: url("/fonts/montserrat/Montserrat-Italic.ttf") format("truetype");
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  :root{
    --bg:#fff;

    /* old feeling: lighter ink */
    --text:#7a7a7a;     /* main menu text */
    --text-hover:#4a4a4a;

    /* tree lines should be even lighter */
    --line:#9a9a9a;

    --pad-left: 95px;
    --pad-top: 70px;

    --font: 16px;
    --lh: 28px;

    --trunk-x: 10px;    /* x position of vertical trunk */
    --arm: 14px;        /* SHORT connector arm */
    --arm-gap: 10px;    /* gap between arm end and text */
    --dash: "- - - ";
  }

  html, body { height: 100%; margin: 0; }
  body{
    background: var(--bg);
    font-family: "Montserrat", Arial, Helvetica, sans-serif;
    font-style: italic; /* keeps your current italic look */
    font-weight: 400;
    font-size: var(--font);
    line-height: var(--lh);
    letter-spacing: 0.02em;
    color: var(--text);
  }

  a{
    color: inherit;
    text-decoration: none;
  }
  a:hover{
    color: var(--text-hover);
    text-decoration: none;
  }

  .wrap{
    padding-left: var(--pad-left);
    padding-top: var(--pad-top);
  }

  .group{ margin-bottom: 26px; }

  .title{
    margin: 0 0 6px 0;
    color: var(--text);
  }

  .tree{
    position: relative;
    padding-left: 28px; /* space for trunk + short arms */
  }

  /* vertical trunk */
  .tree::before{
    content:"";
    position:absolute;
    left: var(--trunk-x);
    top: 10px;
    bottom: 10px;
    width: 1px;
    background: var(--line);
    opacity: 0.6;
  }

  .item{
    position: relative;
    display: block;
    padding-left: calc(var(--arm) + var(--arm-gap));
    white-space: nowrap;
    color: var(--text);
  }

  /* short connector arm (currently disabled below) */
  .item::before{
    content:"";
    position:absolute;
    left: var(--trunk-x);
    top: 50%;
    width: var(--arm);
    height: 1px;
    background: var(--line);
    opacity: 0.5;
    transform: translateY(-50%);
  }

  /* dashed prefix */
  .item span::before{
    content: var(--dash);
    opacity: 0.9;
  }

  /* bottom singles */
  .single{ margin-top: 14px; }
  .single a{
    display:block;
    margin-top: 10px;
    white-space: nowrap;
  }
  .single a::before{
    content: "— ";
    opacity: 0.9;
  }

  /* remove the small horizontal arm before each item */
  a.item::before{
    content: none !important;
    display: none !important;
  }
  a.item::after{
    content: none !important;
    display: none !important;
  }
</style>

</head>
