<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daria Glishchinskaia</title>

  <style>
    /* Baseline responsive safety */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: hidden; }
img, video, svg { max-width: 100%; height: auto; }

/* Forms/buttons tap comfort */
button, a { touch-action: manipulation; }

    :root{
      /* colors */
      --bg:#fff;
      --text:#86090f;
      --hover:#000;

      /* fonts */
      --mono: "Andale Mono", AndaleMono, "Lucida Console", Menlo, Consolas, monospace;
      --sans: Helvetica, "Helvetica Neue", Arial, sans-serif;

      /* the layout is a 4:3 composition: 1u = 1% of its width, fitted into the viewport */
      --u: min(1vw, 1.333vh);

      /* typography */
      --title: max(14px, calc(var(--u) * 1.82));
      --sub: max(11px, calc(var(--u) * 1.18));

      /* placement */
      --pad-x: calc(var(--u) * 2.7);
      --pad-y: calc(var(--u) * 2.4);
      --logo-w: calc(var(--u) * 31);
    }

    body{
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: var(--title);
      letter-spacing: 0.06em;
    }

    a, a:visited{
      color: inherit;
      text-decoration: none;
    }
    a:hover{ color: var(--hover); }

    /* Menu and logo sit above the previews */
    .top{
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--u);
      padding: var(--pad-y) var(--pad-x) 0;
    }

    .logo{
      flex: 0 0 auto;
      display: block;
      width: var(--logo-w);
      margin-top: calc(var(--u) * 0.4);
      pointer-events: none;
      user-select: none;
    }

    .group{ margin-bottom: calc(var(--u) * 0.9); }

    .title{
      display: block;
      line-height: 1.15;
    }

    .sub{
      font-family: var(--sans);
      font-size: var(--sub);
      line-height: 1.3;
      letter-spacing: 0;
    }

    .contacts{
      position: relative;
      z-index: 1;
      padding: 0 var(--pad-x) calc(var(--u) * 3.6);
      line-height: 1.35;
      text-align: center;
    }
    .contacts a{ display: block; }

    /* Hover pictures: placed per picture through data-pos */
    .hover-preview{
      position: fixed;
      z-index: 0;
      pointer-events: none;
    }

    .hover-preview__img{
      display: block;
      width: 100%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .hover-preview.is-on .hover-preview__img{
      opacity: 1;
      transform: translateY(0);
    }

    /* Against the left edge */
    .hover-preview[data-pos="knife"]{ left: 0; top: 28.4vh; width: min(48.8vw, 66.5vh); }
    .hover-preview[data-pos="stone"]{ left: 0; top: 28.4vh; width: min(46.8vw, 64vh); }
    .hover-preview[data-pos="statue"]{ left: 0; bottom: 0; width: min(33.65vh, 60vw); }

    /* Off the left edge */
    .hover-preview[data-pos="earth"]{ left: 19.5vw; top: 28.2vh; width: min(42.7vw, 58.2vh); }

    /* Centered */
    .hover-preview[data-pos="grave"],
    .hover-preview[data-pos="icon"]{ left: 50%; transform: translateX(-50%); }
    .hover-preview[data-pos="grave"]{ top: 38vh; width: min(22.8vw, 30.7vh); }
    .hover-preview[data-pos="icon"]{ top: 20.3vh; width: min(30vw, 40.4vh); }

    /* --- Mobile: logo above the menu, larger tap targets --- */
    @media (max-width: 640px){
      :root{
        --title: 18px;
        --sub: 15px;
        --pad-x: 16px;
        --pad-y: 16px;
      }

      .top{
        flex-direction: column-reverse;
        gap: 24px;
      }

      .logo{
        width: 100%;
        margin-top: 0;
      }

      .group{ margin-bottom: 16px; }
      .title{ margin-bottom: 4px; }
      .sub{ line-height: 2; }

      .contacts{
        padding-top: 32px;
        padding-bottom: 24px;
        font-size: 15px;
      }
      .contacts a{ padding: 4px 0; }
    }
  </style>
</head>

<body>
  <header class="top">
    <nav>

          <a href="sport.html" data-img="previews/sport.png" data-pos="grave">спорт-клуб</a> |

          <a href="collection.html" data-img="index_img/3a5b418e-0ed2-4b4c-93d7-57aaf6c89d4b.png" data-pos="statue">коллекция уязвимых объектов</a> |
          <a href="frontir.html" data-img="previews/frontir.png" data-pos="stone">фронтир</a>
        </div>

      <div class="group">
        <span class="title">фотография</span>
        <div class="sub">
          <a href="parties.html">вечеринки</a> |

<script>
  (function () {
    const preview = document.querySelector('.hover-preview');
    const img = document.querySelector('.hover-preview__img');
    if (!preview || !img) return;

    // all menu links that have preview images
    const links = document.querySelectorAll('a[data-img]');
    let active = false;

    // download all pictures on opening, so hovering shows them at once
    // (touch screens have no hover and never show them, so they skip this)
    const preloaded = [];
    if (window.matchMedia('(hover: hover)').matches) {
      links.forEach(a => {
        const pic = new Image();
        pic.src = a.dataset.img;
        preloaded.push(pic);
      });
    }

    // reveal only once loaded, so a picture never shows at the previous one's position
    img.addEventListener('load', () => {
      if (active) preview.classList.add('is-on');
    });

    function show(a){
      active = true;
      preview.classList.remove('is-on');
      preview.dataset.pos = a.dataset.pos;
      img.src = a.dataset.img;
    }

    function hide(){
      active = false;
      preview.classList.remove('is-on');
    }

    links.forEach(a => {
      a.addEventListener('mouseenter', () => show(a));
      a.addEventListener('focus', () => show(a));
      a.addEventListener('mouseleave', hide);
      a.addEventListener('blur', hide);
    });
  })();
</script>

</body>
</html>
