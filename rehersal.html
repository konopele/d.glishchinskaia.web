<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>репетиция — Дарья Глищинская</title>

  <style>
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Light.ttf") format("truetype");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

:root{
  --bg:#fff;
  --fg:#000;

  --topbar-h:56px;

  --dot-size:5px;
  --dot-gap:6px;
  --dot-shift:-10px;

  /* layout */
  --slide-pad-x: clamp(18px, 4vw, 60px);
  --slide-pad-y: clamp(18px, 3vh, 36px);

  /* image blur while loading */
  --blur: 18px;
}

html, body{
  height: 100%;
}
body{
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden; /* we control wheel manually */
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
}

/* ✅ fixed top stripe */
.topbar{
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: var(--bg);
  z-index: 20;
}

/* ✅ menu dots */
.menu-link{
  position: fixed;
  top: calc(var(--topbar-h) / 2);
  left: 98%;
  transform: translate(-50%, -50%) translateX(var(--dot-shift));
  z-index: 30;
  padding: 8px 12px;
  text-decoration: none;
  filter: blur(3.25px);
  -webkit-tap-highlight-color: transparent;
}
.dots{ display:flex; gap: var(--dot-gap); }
.dot{
  width: var(--dot-size);
  height: var(--dot-size);
  border-radius: 50%;
  background: var(--fg);
  opacity: 0.9;
}
.menu-link:focus-visible{
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}
.dots::before,.dots::after,
.menu-link::before,.menu-link::after{
  content:none !important;
  display:none !important;
}

/* ✅ stage + viewport below topbar */
.stage{
  position: fixed;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.viewport{
  position: absolute;
  top: var(--topbar-h);
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}

/* --- SLIDES --- */
.slides{
  position: absolute;
  inset: 0;
  background: var(--bg);
}

/* one slide at a time */
.slide{
  position: absolute;
  inset: 0;
  display: none;
  background: var(--bg);
}
.slide.is-active{
  display: block;
}

/* slide inner frame controls lateral gaps (not too big on fullscreen) */
.slide-inner{
  height: 100%;
  width: 100%;
  padding: var(--slide-pad-y) var(--slide-pad-x);
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  overflow: hidden; /* never go past right edge */
}

/* optional header inside slide (like your reference) */
.slide-head{
  width: 100%;
  height: clamp(90px, 18vh, 160px);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.slide-title{
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.08em;
  font-weight: 400;
  opacity: 0.75;
  font-style: italic;
}
.slide-txt{
  margin-top: 14px;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg);
  padding: 0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.02em;
  font-weight: 400;
  opacity: 0.55;
  cursor: pointer;
  font-style: italic;
}

/* image base: never overflow; no crop */
.media{
  max-width: 100%;
  max-height: 100%;
  object-fit: contain; /* ✅ never crop */
  display: block;
}

/* blur while loading */
.media.is-loading{
  filter: blur(var(--blur));
  transform: translateZ(0);
}

/* --- Slide 1 (single panorama) --- */
.slide--single .single-wrap{
  width: 100%;
  flex: 1 1 auto;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* --- Slide 2 (three across) --- */
.triptych{
  width: 100%;
  flex: 1 1 auto;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2vw, 22px);

  align-items: center;
  justify-items: center;
  overflow: hidden;
}
.triptych .media{
  width: 100%;
  height: auto;
  max-height: 100%;
}

/* --- Slide 2 layout: big-left + triple-right --- */
.slide--duo3 .duo3{
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1.05fr 1fr;              /* left slightly wider */
  gap: clamp(18px, 4vw, 54px);
  align-items: center;
  overflow: hidden;
}

.slide--duo3 .left{
  height: 100%;
  display: grid;
  align-items: center;
  overflow: hidden;
}
.slide--duo3 .left .media{
  width: 100%;
  height: 100%;
  max-height: 100%;
  object-fit: contain;                            /* ✅ no crop */
}

.slide--duo3 .right{
  height: 100%;
  display: grid;
  align-items: center;                            /* center vertically */
  overflow: hidden;
}

.slide--duo3 .triples{
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2.2vw, 26px);
  align-items: center;
  justify-items: center;
}

/* each repeated image is a “card” with fixed-ish height, no crop */
.slide--duo3 .triples .media{
  width: 100%;
  height: min(60vh, 520px);                       /* controls the 3-up size */
  object-fit: contain;                            /* ✅ no crop */
}

/* responsive: stack right under left on narrow screens */
@media (max-width: 900px){
  .slide--duo3 .duo3{
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .slide--duo3 .triples{
    grid-template-columns: 1fr;
  }
  .slide--duo3 .triples .media{
    height: auto;
  }
}

/* =========================
   SLIDE 3: one photo top-right
   ========================= */
.slide--solo-tr .solo-tr{
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}
.slide--solo-tr .solo-tr .media{
  position: absolute;
  top: clamp(18px, 4vh, 48px);
  right: clamp(18px, 4vw, 70px);
  width: min(320px, 34vw);
  height: auto;
  max-height: 60vh;
  object-fit: contain; /* no crop */
}

/* =========================
   SLIDE 4: tiled background + overlay portrait
   (background uses cover to fill, like your reference)
   ========================= */
.slide--pattern .pattern{
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}
.slide--pattern .pattern-bg{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;          /* fills the slide like your screenshot */
  display: block;
}
.slide--pattern .pattern-overlay{
  position: absolute;
  top: 50%;
  left: 70%;                  /* slightly right of center */
  transform: translate(-50%, -50%);
  width: min(320px, 26vw);
  max-height: 70vh;
  height: auto;
  object-fit: contain;        /* no crop */
  border: 2px solid rgba(0,0,0,0.35);
  background: rgba(255,255,255,0.01);
}

/* =========================
   SLIDE 5: left single + right triple
   ========================= */
.slide--left1right3 .lr13{
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: clamp(18px, 4vw, 54px);
  align-items: center;
  overflow: hidden;
}
.slide--left1right3 .lr13-left{
  height: 100%;
  display: grid;
  align-items: center;
  overflow: hidden;
}
.slide--left1right3 .lr13-left .media{
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.slide--left1right3 .lr13-right{
  height: 100%;
  display: grid;
  align-items: center;
  overflow: hidden;
}
.slide--left1right3 .lr13-right-grid{
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2.2vw, 26px);
  align-items: center;
  justify-items: center;
}
.slide--left1right3 .lr13-right-grid .media{
  width: 100%;
  height: min(58vh, 520px);
  object-fit: contain;
}

/* =========================
   SLIDE 6: internally scrollable
   ========================= */
.slide--scroll .slide-inner{
  padding: 0; /* scrollpane manages padding */
}

/* The scrollable area */
.scrollpane{
  height: 100%;
  width: 100%;
  overflow: auto;
  -webkit-overflow-scrolling: touch;

  padding: var(--slide-pad-y) var(--slide-pad-x);
  box-sizing: border-box;
}

/* Content taller than viewport -> scroll */
.slide6-grid{
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;

  display: grid;
  grid-template-columns: 0.72fr 1fr 0.72fr;
  grid-auto-rows: min-content;
  gap: clamp(14px, 2.2vw, 28px);

  align-items: start;
}

/* Left stack: 4 copies */
.slide6-left{
  display: grid;
  gap: clamp(10px, 1.6vw, 18px);
}

/* Top center + top right */
.slide6-top-center{ align-self: start; }
.slide6-top-right{ align-self: start; justify-self: end; }

/* Big center image */
.slide6-center-big{
  grid-column: 2 / 3;
  justify-self: center;
}

/* Bottom row */
.slide6-bottom-left{ grid-column: 1 / 2; }
.slide6-bottom-center{ grid-column: 2 / 3; justify-self: center; }
.slide6-bottom-right{ grid-column: 3 / 4; justify-self: end; }

/* sizing (no crop) */
.slide6-grid .media{
  width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
}

/* constrain some blocks so layout matches your reference proportions */
.slide6-left .media{ max-width: 340px; }
.slide6-top-center .media{ max-width: 420px; }
.slide6-top-right .media{ max-width: 320px; }
.slide6-center-big .media{ max-width: 560px; }
.slide6-bottom-left .media{ max-width: 420px; }
.slide6-bottom-center .media{ max-width: 320px; }
.slide6-bottom-right .media{ max-width: 340px; }

/* give scroll some “air” like your reference */
.slide6-spacer{
  height: clamp(40px, 10vh, 140px);
}

/* responsive */
@media (max-width: 980px){
  .slide6-grid{
    grid-template-columns: 1fr;
  }
  .slide6-left, .slide6-top-center, .slide6-top-right,
  .slide6-center-big, .slide6-bottom-left, .slide6-bottom-center, .slide6-bottom-right{
    grid-column: 1 / -1;
    justify-self: center;
  }
  .slide6-left .media,
  .slide6-top-center .media,
  .slide6-top-right .media,
  .slide6-center-big .media,
  .slide6-bottom-left .media,
  .slide6-bottom-center .media,
  .slide6-bottom-right .media{
    max-width: min(560px, 92vw);
  }
}

/* =========================
   SLIDE 7: three same + one on the right
   ========================= */
.slide--threeplusone .tpo{
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1.05fr;
  gap: clamp(14px, 2.4vw, 28px);
  align-items: start;
  overflow: hidden;
}
.slide--threeplusone .tpo .sq{
  width: 100%;
  height: min(42vh, 360px);
  object-fit: contain; /* no crop */
}
.slide--threeplusone .tpo .right{
  width: 100%;
  height: min(48vh, 420px);
  object-fit: contain; /* no crop */
  justify-self: end;
  align-self: start;
}

/* responsive */
@media (max-width: 900px){
  .slide--left1right3 .lr13{
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .slide--left1right3 .lr13-right-grid{
    grid-template-columns: 1fr;
  }
  .slide--left1right3 .lr13-right-grid .media{
    height: auto;
  }

  .slide--threeplusone .tpo{
    grid-template-columns: 1fr;
  }
  .slide--threeplusone .tpo .sq,
  .slide--threeplusone .tpo .right{
    height: auto;
  }

  .slide--solo-tr .solo-tr .media{
    right: 18px;
    width: min(320px, 70vw);
  }

  .slide--pattern .pattern-overlay{
    left: 62%;
    width: min(320px, 56vw);
  }
}

/* responsive: stack on narrow screens */
@media (max-width: 720px){
  .triptych{
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .slide-head{
    height: 120px;
  }
}
  </style>
</head>

<script>
(() => {
  const slides = Array.from(document.querySelectorAll('[data-slide]'));
  let index = 0;

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function setActive(i){
    index = clamp(i, 0, slides.length - 1);
    slides.forEach((s, k) => s.classList.toggle('is-active', k === index));
    hydrateSlide(slides[index]);
    // reset edge buffers whenever we change slides
    edgeTopHits = 0;
    edgeBottomHits = 0;
    wheelAcc = 0;
  }

  // ---- Blur until loaded (per image) ----
  function setLoading(img, on){
    img.classList.toggle('is-loading', on);
  }

  function hydrateSlide(slideEl){
    const imgs = Array.from(slideEl.querySelectorAll('img'));
    imgs.forEach(img => {
      if (img.dataset.bound === '1') return;
      img.dataset.bound = '1';

      setLoading(img, !img.complete);

      img.addEventListener('load', () => setLoading(img, false), { passive: true });
      img.addEventListener('error', () => {
        console.warn('Missing image:', img.getAttribute('src'));
        img.style.display = 'none';
      }, { passive: true });
    });
  }

  // hydrate first slide immediately
  if (slides[0]) hydrateSlide(slides[0]);

  function next(){ setActive(index + 1); }
  function prev(){ setActive(index - 1); }

  // =========================
  // Piece-wise navigation (one gesture => one slide)
  // + Special scroll-slide gating (Slide 6)
  // =========================
  let wheelAcc = 0;
  let wheelUnlockTimer = null;
  let wheelLocked = false;

  // For the special scrollable slide:
  // 1 stroke at edge does nothing, 2nd stroke changes slide
  let edgeTopHits = 0;
  let edgeBottomHits = 0;

  function getActiveSlide(){
    return slides[index];
  }

  function getScrollPaneIfAny(slideEl){
    return slideEl?.querySelector('.scrollpane') || null;
  }

  function atTop(pane){ return pane.scrollTop <= 0; }
  function atBottom(pane){
    return pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 1;
  }

  window.addEventListener('wheel', (e) => {
    // We fully control the interaction; prevent native scrolling
    e.preventDefault();

    const slide = getActiveSlide();
    if (!slide) return;

    // dominant axis: vertical OR horizontal (trackpad left/right)
    const dy = e.deltaY;
    const dx = e.deltaX;
    const dominant = (Math.abs(dy) >= Math.abs(dx)) ? dy : dx;

    // direction: + => next, - => prev
    const dir = dominant > 0 ? 1 : (dominant < 0 ? -1 : 0);
    if (!dir) return;

    // ----- Special slide: internally scrollable + edge "buffer stroke" -----
    const isScrollSlide = slide.hasAttribute('data-scroll-slide');
    const pane = isScrollSlide ? getScrollPaneIfAny(slide) : null;

    if (pane){
      const wantNext = dir > 0;
      const wantPrev = dir < 0;

      const canScrollDown = !atBottom(pane);
      const canScrollUp = !atTop(pane);

      // If we can scroll inside in the travel direction: do it and reset buffers
      if ((wantNext && canScrollDown) || (wantPrev && canScrollUp)){
        edgeTopHits = 0;
        edgeBottomHits = 0;

        // make internal scroll feel natural
        pane.scrollTop += dominant;
        return;
      }

      // At top edge trying to go previous
      if (wantPrev && atTop(pane)){
        edgeTopHits += 1;
        edgeBottomHits = 0;
        if (edgeTopHits < 2) return;  // first stroke: buffer
        edgeTopHits = 0;
        prev();
        return;
      }

      // At bottom edge trying to go next
      if (wantNext && atBottom(pane)){
        edgeBottomHits += 1;
        edgeTopHits = 0;
        if (edgeBottomHits < 2) return; // first stroke: buffer
        edgeBottomHits = 0;
        next();
        return;
      }

      return;
    }

    // ----- Normal slides: one gesture => one slide -----
    if (wheelLocked) return;

    wheelAcc += dominant;

    // threshold: when exceeded, advance exactly once
    if (Math.abs(wheelAcc) >= 60){
      wheelLocked = true;
      wheelAcc = 0;

      if (dir > 0) next();
      else prev();
    }

    // unlock when gesture ends (wheel quiets down)
    clearTimeout(wheelUnlockTimer);
    wheelUnlockTimer = setTimeout(() => {
      wheelLocked = false;
      wheelAcc = 0;
    }, 180);

  }, { passive: false });

  // Optional: keyboard arrows
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next();
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') prev();
  });

  // Optional: touch swipe (mobile) — one swipe => one slide
  let sx = 0, sy = 0;
  window.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    sx = t.clientX;
    sy = t.clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;

    const dx = sx - t.clientX;
    const dy = sy - t.clientY;

    // swipe up OR swipe left => next; swipe down OR swipe right => prev
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 40) next();
      else if (dx < -40) prev();
    } else {
      if (dy > 40) next();
      else if (dy < -40) prev();
    }

    sx = 0; sy = 0;
  }, { passive: true });

  // Ensure we start on slide 0
  setActive(0);
})();
</script>
