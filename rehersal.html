<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>репетиция — Дарья Глищинская</title>

<style>
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Light.ttf") format("truetype");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

:root{
  --bg:#fff;
  --fg:#000;

  --topbar-h:56px;

  --dot-size:5px;
  --dot-gap:6px;
  --dot-shift:-10px;

  --pad-x: clamp(18px, 4vw, 60px);
  --pad-y: clamp(18px, 3vh, 36px);

  --blur: 18px;
}

html, body{ height:100%; }
body{
  margin:0;
  background: var(--bg);
  color: var(--fg);
  overflow:hidden; /* JS controls scroll */
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
}

/* top stripe */
.topbar{
  position:fixed;
  top:0; left:0; right:0;
  height: var(--topbar-h);
  background: var(--bg);
  z-index:20;
}

/* menu dots */
.menu-link{
  position: fixed;
  top: calc(var(--topbar-h) / 2);
  left: 98%;
  transform: translate(-50%, -50%) translateX(var(--dot-shift));
  z-index: 30;
  padding: 8px 12px;
  text-decoration: none;
  filter: blur(3.25px);
  -webkit-tap-highlight-color: transparent;
}
.dots{ display:flex; gap: var(--dot-gap); }
.dot{
  width: var(--dot-size);
  height: var(--dot-size);
  border-radius: 50%;
  background: var(--fg);
  opacity: 0.9;
}
.menu-link:focus-visible{
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}
.dots::before,.dots::after,
.menu-link::before,.menu-link::after{
  content:none !important;
  display:none !important;
}

/* stage */
.stage{ position:fixed; inset:0; background:var(--bg); overflow:hidden; }
.viewport{
  position:absolute;
  top: var(--topbar-h);
  left:0; right:0; bottom:0;
  overflow:hidden;
}

/* slides */
.slides{ position:absolute; inset:0; background:var(--bg); }
.slide{ position:absolute; inset:0; display:none; background:var(--bg); }
.slide.is-active{ display:block; }

.slide-inner{
  width:100%;
  height:100%;
  box-sizing:border-box;
  padding: var(--pad-y) var(--pad-x);
  overflow:hidden;
}

/* images */
.media{
  display:block;
  max-width:100%;
  max-height:100%;
  object-fit: contain; /* never crop */
}
.media.is-loading{
  filter: blur(var(--blur));
  transform: translateZ(0);
}

/* ---------- SLIDE 1 ---------- */
.slide--single .slide-inner{
  position: relative;
  width: 100%;
  height: 100%;
  padding: 0;           /* no side white frames */
  overflow: hidden;
  background: var(--bg);
}

/* top white area with the text positioned like in the reference */
.slide--single .slide-head{
  position: absolute;
  inset: 0 0 auto 0;
  height: 170px;        /* white area above the image */
  margin: 0;
  z-index: 2;
  pointer-events: none; /* so only txt button remains clickable */
}

.slide--single .slide-title{
  position: absolute;
  top: 58px;
  left: 39%;
  transform: translateX(-50%);
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.04em;
  font-weight: 400;
  font-style: italic;
  opacity: 0.8;
  line-height: 1;
  white-space: nowrap;
  text-align: center;
}

.slide--single .slide-txt{
  position: absolute;
  top: 95px;
  left: 58.5%;
  transform: translateX(-50%);
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--fg);
  font-family: inherit;
  font-size: 18px;
  font-weight: 400;
  font-style: italic;
  opacity: 0.65;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  pointer-events: auto; /* clickable */
}

/* image block */
.slide--single .single-wrap{
  position: absolute;
  left: 0;
  right: 0;
  top: 170px;   /* starts right after the white header area */
  bottom: 0;
  overflow: hidden;
  display: block;
}

/* fit to WIDTH */
.slide--single .single-wrap .media{
  display: block;
  width: 100%;
  height: auto;
  max-width: none;
  max-height: none;
  object-fit: contain;
}

/* ---------- Slide 2 (layout computed in JS; no side/bottom frames) ---------- */
.slide--duo3 .slide-inner{
  padding: 0;            /* remove frames */
  overflow:hidden;
}
.duo3{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}
.duo3 .duo3-left,
.duo3 .duo3-r{
  position:absolute;
  width:auto;
  height:auto;
  max-width:none;
  max-height:none;
  object-fit: contain; /* never crop */
}

/* ---------- Slide 3 ---------- */
.solo-tr{
  position:relative;
  width:100%;
  height:100%;
}
.solo-tr .media{
  position:absolute;
  top: clamp(10px, 2vh, 30px);
  right: clamp(10px, 2vw, 40px);
  width: min(360px, 35vw);
  height:auto;
  max-height: 70vh;
}

/* ---------- Slide 4 ---------- */
.pattern{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}
.pattern-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit: cover; /* background fills */
}
.pattern-overlay{
  position:absolute;
  top:50%;
  left:70%;
  transform: translate(-50%, -50%);
  width: min(340px, 28vw);
  max-height: 75vh;
  height:auto;
  object-fit: contain;
  border: 2px solid rgba(0,0,0,0.35);
  background: rgba(255,255,255,0.01);
}

/* ---------- Slide 5 ---------- */
.lr13{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: clamp(18px, 4vw, 54px);
  align-items:center;
}
.lr13-left, .lr13-right{
  height:100%;
  display:grid;
  align-items:center;
  overflow:hidden;
}
.lr13-left .media{
  width:100%;
  height:100%;
}
.lr13-right-grid{
  width:100%;
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2.2vw, 26px);
  align-items:center;
}
.lr13-right-grid .media{
  width:100%;
  height: min(58vh, 520px);
}

/* ---------- Slide 6 (scrollable) ---------- */
.slide--scroll .slide-inner{ padding:0; }
.scrollpane{
  width:100%;
  height:100%;
  overflow:auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--pad-y) var(--pad-x);
  box-sizing:border-box;
}
.slide6-grid{
  width:100%;
  max-width: 1400px;
  margin:0 auto;
  display:grid;
  grid-template-columns: 0.72fr 1fr 0.72fr;
  gap: clamp(14px, 2.2vw, 28px);
  align-items:start;
}
.slide6-left{
  display:grid;
  gap: clamp(10px, 1.6vw, 18px);
}
.slide6-top-center{ align-self:start; }
.slide6-top-right{ align-self:start; justify-self:end; }
.slide6-center-big{ grid-column: 2 / 3; justify-self:center; }
.slide6-bottom-left{ grid-column: 1 / 2; }
.slide6-bottom-center{ grid-column: 2 / 3; justify-self:center; }
.slide6-bottom-right{ grid-column: 3 / 4; justify-self:end; }

.slide6-grid .media{ width:100%; height:auto; }
.slide6-left .media{ max-width: 340px; }
.slide6-top-center .media{ max-width: 420px; }
.slide6-top-right .media{ max-width: 320px; }
.slide6-center-big .media{ max-width: 560px; }
.slide6-bottom-left .media{ max-width: 420px; }
.slide6-bottom-center .media{ max-width: 320px; }
.slide6-bottom-right .media{ max-width: 340px; }
.slide6-spacer{ height: clamp(40px, 10vh, 140px); }

/* ---------- Slide 7 ---------- */
.tpo{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns: 1fr 1fr 1fr 1.05fr;
  gap: clamp(14px, 2.4vw, 28px);
  align-items:start;
}
.tpo .sq{
  width:100%;
  height: min(42vh, 360px);
  object-fit: contain;
}
.tpo .right{
  width:100%;
  height: min(48vh, 420px);
  object-fit: contain;
  justify-self:end;
}

/* responsive */
@media (max-width: 980px){
  .lr13{ grid-template-columns: 1fr; gap: 18px; }
  .lr13-right-grid{ grid-template-columns: 1fr; }
  .lr13-right-grid .media{ height:auto; }

  .slide6-grid{ grid-template-columns: 1fr; }
  .slide6-left, .slide6-top-center, .slide6-top-right,
  .slide6-center-big, .slide6-bottom-left, .slide6-bottom-center, .slide6-bottom-right{
    grid-column: 1 / -1;
    justify-self: center;
  }
  .slide6-left .media,
  .slide6-top-center .media,
  .slide6-top-right .media,
  .slide6-center-big .media,
  .slide6-bottom-left .media,
  .slide6-bottom-center .media,
  .slide6-bottom-right .media{
    max-width: min(560px, 92vw);
  }

  .tpo{ grid-template-columns: 1fr; }
  .tpo .sq, .tpo .right{ height:auto; }
}
</style>
</head>

<body>
  <div class="topbar" aria-hidden="true"></div>

  <a class="menu-link" href="menu.html" aria-label="Open menu">
    <span class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span>
  </a>

  <div class="stage">
    <div class="viewport">
      <div class="slides" id="slides">

<!-- SLIDE 1 -->
<section class="slide slide--single is-active" data-slide>
  <div class="slide-inner">

    <div class="slide-head">
      <div class="slide-title">репетиция</div>
      <button class="slide-txt" id="txtBtn" type="button">txt</button>
    </div>

    <div class="single-wrap">
      <img class="media" src="rehersal/01.jpg" alt="">
    </div>

  </div>
</section>

<!-- SLIDE 2 -->
<section class="slide slide--duo3" data-slide>
  <div class="slide-inner">
    <div class="duo3">
      <div class="duo3-leftbox">
        <img class="media duo3-left" src="rehersal/06.jpg" alt="">
      </div>

      <div class="duo3-right">
        <div class="duo3-cell">
          <img class="media duo3-r" src="rehersal/07.jpg" alt="">
        </div>
        <div class="duo3-cell">
          <img class="media duo3-r" src="rehersal/07.jpg" alt="">
        </div>
        <div class="duo3-cell">
          <img class="media duo3-r" src="rehersal/07.jpg" alt="">
        </div>
      </div>
    </div>
  </div>
</section>

<!-- SLIDE 3: one photo top-right -->
<section class="slide slide--solo-tr" data-slide>
  <div class="slide-inner">
    <div class="solo-tr">
      <img class="media" src="rehersal/04.jpg" alt="">
    </div>
  </div>
</section>

<!-- SLIDE 4: tiled background + overlay -->
<section class="slide slide--pattern" data-slide>
  <div class="slide-inner">
    <div class="pattern">
      <img class="media pattern-bg" src="rehersal/08.png" alt="">
      <img class="media pattern-overlay" src="rehersal/09.jpg" alt="">
    </div>
  </div>
</section>

<!-- SLIDE 5: left single + right triple -->
<section class="slide slide--left1right3" data-slide>
  <div class="slide-inner">
    <div class="lr13">
      <div class="lr13-left">
        <img class="media" src="rehersal/03.jpg" alt="">
      </div>
      <div class="lr13-right">
        <div class="lr13-right-grid">
          <img class="media" src="rehersal/02.jpg" alt="">
          <img class="media" src="rehersal/02.jpg" alt="">
          <img class="media" src="rehersal/02.jpg" alt="">
        </div>
      </div>
    </div>
  </div>
</section>

<!-- SLIDE 6 (scrollable) -->
<section class="slide slide--scroll" data-slide data-scroll-slide>
  <div class="slide-inner">
    <div class="scrollpane">
      <div class="slide6-grid">

        <!-- left stack (x4) -->
        <div class="slide6-left">
          <img class="media" src="rehersal/11.jpg" alt="">
          <img class="media" src="rehersal/11.jpg" alt="">
          <img class="media" src="rehersal/11.jpg" alt="">
          <img class="media" src="rehersal/11.jpg" alt="">
        </div>

        <!-- top center -->
        <div class="slide6-top-center">
          <img class="media" src="rehersal/12.jpg" alt="">
        </div>

        <!-- top right -->
        <div class="slide6-top-right">
          <img class="media" src="rehersal/13.jpg" alt="">
        </div>

        <!-- big center -->
        <div class="slide6-center-big">
          <img class="media" src="rehersal/16.jpg" alt="">
        </div>

        <!-- bottom row -->
        <div class="slide6-bottom-left">
          <img class="media" src="rehersal/17.jpg" alt="">
        </div>

        <div class="slide6-bottom-center">
          <img class="media" src="rehersal/10.jpg" alt="">
        </div>

        <div class="slide6-bottom-right">
          <img class="media" src="rehersal/03.jpg" alt="">
        </div>

      </div>

      <!-- extra space so it feels like a “page” you scroll through -->
      <div class="slide6-spacer" aria-hidden="true"></div>
    </div>
  </div>
</section>

<!-- SLIDE 7: three same + one on the right -->
<section class="slide slide--fixed7" data-slide>
  <div class="slide-inner">
    <div class="fixed-canvas" data-fixed-canvas>
      <!-- 3 same images -->
      <img class="media a1" src="rehersal/15.jpg" alt="">
      <img class="media a2" src="rehersal/15.jpg" alt="">
      <img class="media a3" src="rehersal/15.jpg" alt="">

      <!-- 4th image (right) -->
      <img class="media b1" src="rehersal/14.jpg" alt="">
    </div>
  </div>
</section>

      </div>
    </div>
  </div>

<script>
(() => {
  const slides = Array.from(document.querySelectorAll('[data-slide]'));
  let index = 0;

  // ---------- helpers ----------
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  // ---------- blur-on-load ----------
  function setLoading(img, on){ img.classList.toggle('is-loading', on); }

  function hydrateSlide(slideEl){
    if (!slideEl) return;
    const imgs = Array.from(slideEl.querySelectorAll('img'));
    imgs.forEach(img => {
      if (img.dataset.bound === '1') return;
      img.dataset.bound = '1';

      setLoading(img, !img.complete);

      img.addEventListener('load', () => setLoading(img, false), { passive:true });
      img.addEventListener('error', () => {
        console.warn('Missing image:', img.getAttribute('src'));
        img.style.display = 'none';
      }, { passive:true });
    });
  }

  // ---------- Slide 2 fitter (5:3 HEIGHTS, big gap = 3x small gap, no frames) ----------
  function fitSlide2IfActive(){
    const slide = slides[index];
    if (!slide || !slide.classList.contains('slide--duo3')) return;

    const frame = slide.querySelector('.slide-inner');
    const wrap  = slide.querySelector('.duo3');
    const left  = slide.querySelector('.duo3-left');
    const rights = Array.from(slide.querySelectorAll('.duo3-r'));

    if (!frame || !wrap || !left || rights.length !== 3) return;

    // Need image intrinsic sizes
    if (!left.naturalWidth || !left.naturalHeight || !rights[0].naturalWidth || !rights[0].naturalHeight) return;

    const availW = frame.clientWidth;
    const availH = frame.clientHeight;

    // gaps: big = 3x small
    const gapSmall = 18;
    const gapBig = gapSmall * 3;

    const leftAR = left.naturalWidth / left.naturalHeight;
    const rightAR = rights[0].naturalWidth / rights[0].naturalHeight;

    // height unit u:
    // leftH = 5u
    // rightH = 3u
    // totalW = leftAR*(5u) + gapBig + 3*(rightAR*(3u)) + 2*gapSmall
    const uByHeight = availH / 5;
    const uByWidth  = (availW - gapBig - 2*gapSmall) / (leftAR*5 + rightAR*9);
    const u = Math.max(0, Math.min(uByHeight, uByWidth));

    const leftH = 5*u;
    const rightH = 3*u;

    const leftW  = leftAR * leftH;
    const rightW = rightAR * rightH;

    // Anchor to left/bottom to remove bottom/side frames
    const baseX = 0;
    const baseY = availH - leftH;

    // left
    left.style.height = `${leftH}px`;
    left.style.left = `${baseX}px`;
    left.style.top  = `${baseY}px`;

    // right trio (vertically centered vs left)
    const rightY = baseY + (leftH - rightH)/2;
    const rightX0 = baseX + leftW + gapBig;

    rights.forEach((img, i) => {
      img.style.height = `${rightH}px`;
      img.style.left = `${rightX0 + i*(rightW + gapSmall)}px`;
      img.style.top  = `${rightY}px`;
    });
  }

  // ---------- slide switching ----------
  function setActive(i){
    index = clamp(i, 0, slides.length - 1);
    slides.forEach((s, k) => s.classList.toggle('is-active', k === index));
    hydrateSlide(slides[index]);

    // layout fixes after images load/layout
    requestAnimationFrame(() => {
      fitSlide2IfActive();
    });

    // reset wheel state + buffers
    wheelAcc = 0;
    wheelLocked = false;
    edgeTopHits = 0;
    edgeBottomHits = 0;
  }

  function next(){ setActive(index + 1); }
  function prev(){ setActive(index - 1); }

  // ---------- piece-wise wheel nav + slide6 gating ----------
  let wheelAcc = 0;
  let wheelUnlockTimer = null;
  let wheelLocked = false;

  let edgeTopHits = 0;
  let edgeBottomHits = 0;

  function getActiveSlide(){ return slides[index]; }
  function getScrollPaneIfAny(slideEl){ return slideEl?.querySelector('.scrollpane') || null; }
  function atTop(pane){ return pane.scrollTop <= 0; }
  function atBottom(pane){ return pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 1; }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();

    const slide = getActiveSlide();
    if (!slide) return;

    const dy = e.deltaY;
    const dx = e.deltaX;
    const dominant = (Math.abs(dy) >= Math.abs(dx)) ? dy : dx;
    const dir = dominant > 0 ? 1 : (dominant < 0 ? -1 : 0);
    if (!dir) return;

    // Slide 6 special: internal scroll + 2-stroke edge gate
    const isScrollSlide = slide.hasAttribute('data-scroll-slide');
    const pane = isScrollSlide ? getScrollPaneIfAny(slide) : null;

    if (pane){
      const wantNext = dir > 0;
      const wantPrev = dir < 0;

      const canScrollDown = !atBottom(pane);
      const canScrollUp   = !atTop(pane);

      if ((wantNext && canScrollDown) || (wantPrev && canScrollUp)){
        edgeTopHits = 0;
        edgeBottomHits = 0;
        pane.scrollTop += dominant;
        return;
      }

      if (wantPrev && atTop(pane)){
        edgeTopHits += 1;
        edgeBottomHits = 0;
        if (edgeTopHits < 2) return;
        edgeTopHits = 0;
        prev();
        return;
      }

      if (wantNext && atBottom(pane)){
        edgeBottomHits += 1;
        edgeTopHits = 0;
        if (edgeBottomHits < 2) return;
        edgeBottomHits = 0;
        next();
        return;
      }

      return;
    }

    // Normal slides: one gesture => one slide
    if (wheelLocked) return;

    wheelAcc += dominant;
    if (Math.abs(wheelAcc) >= 60){
      wheelLocked = true;
      wheelAcc = 0;
      if (dir > 0) next(); else prev();
    }

    clearTimeout(wheelUnlockTimer);
    wheelUnlockTimer = setTimeout(() => {
      wheelLocked = false;
      wheelAcc = 0;
    }, 180);
  }, { passive:false });

  // keyboard
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next();
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') prev();
  });

  // touch swipe (mobile)
  let sx = 0, sy = 0;
  window.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    sx = t.clientX; sy = t.clientY;
  }, { passive:true });

  window.addEventListener('touchend', (e) => {
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;

    const dx = sx - t.clientX;
    const dy = sy - t.clientY;

    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 40) next();
      else if (dx < -40) prev();
    } else {
      if (dy > 40) next();
      else if (dy < -40) prev();
    }

    sx = 0; sy = 0;
  }, { passive:true });

  // resize: refit slide 2 if active
  window.addEventListener('resize', () => {
    requestAnimationFrame(() => fitSlide2IfActive());
  }, { passive:true });

  // init
  hydrateSlide(slides[0]);
  setActive(0);

  // If slide2 images load after init, refit once they load
  document.querySelectorAll('.slide--duo3 img').forEach(img => {
    img.addEventListener('load', () => requestAnimationFrame(() => fitSlide2IfActive()), { passive:true });
  });
})();
</script>
</body>
</html>
