<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>репетиция — Дарья Глищинская</title>

  <style>
    @font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Light.ttf") format("truetype");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Medium.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

    :root{
      --bg:#fff;
      --fg:#000;

      --top-gap:46px;     /* space above photos for dots */
      --dot-size:5px;
      --dot-gap:6px;
      --dot-shift:-10px;  /* negative = shift left */

      --edge-zone:80px;   /* px near left/right edges that triggers scrolling */
      --max-speed:18;     /* px per frame */
      --page-pad:0px;     /* keep 0 for flush look */
    }

body{
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
}

:root{
  --bg:#fff;
  --fg:#000;

  /* ✅ top white stripe height */
  --topbar-h:56px;

  /* keep using this as the reserved height above photos */
  --top-gap: var(--topbar-h);

  --dot-size:5px;
  --dot-gap:6px;
  --dot-shift:-10px;

  /* ✅ remove frames so content touches sides */
  --left-frame: 0px;
  --right-frame: 0px;

  --end-gap: 24px;
  --page-pad-top:0px;
  --page-pad:0px;
}

/* ✅ fixed top stripe, opaque, no border/frame */
.topbar{
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-h);
  background: var(--bg);
  z-index: 20;
}

/* ✅ stage must be positioned, and touch edges */
.stage{
  position: fixed;      /* IMPORTANT: your top/left/right/bottom now apply */
  inset: 0;             /* touch all sides */
  background: var(--bg);
  overflow: hidden;
}

/* photos start under the stripe */
.viewport{
  position: absolute;
  inset: 0;
  padding-top: var(--top-gap);
  box-sizing: border-box;
  overflow: hidden;
}

/* ✅ menu-link anchored inside the stripe */
.menu-link{
  position: fixed;
  top: calc(var(--topbar-h) / 2);
  left: 98%;
  transform: translate(-50%, -50%) translateX(var(--dot-shift));
  z-index: 30; /* above stripe */
  padding: 8px 12px;
  text-decoration: none;
  filter: blur(3.25px);
  -webkit-tap-highlight-color: transparent;
}

/* strip is vertical => "narrow" means smaller HEIGHT */
.intro-panel{
  flex: 0 0 200px;   /* ✅ 200px tall */
  height: auto;
  width: 100%;
  background: var(--bg);
  position: relative;
  box-sizing: border-box;
}

.intro-title{ /* здесь ты стайлишь надпись фронтир */
  /* MOVE TITLE HERE */
  position: absolute;
  top: var(--intro-top);
  left: 45%;
  top: 25%;
  
  /* CHANGE TITLE FONT STYLING HERE */
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.08em;
  font-weight: 400;
  opacity: 0.75;
  font-style: italic;
}

.intro-txt{ /* здесь ты стайлишь надпись txt */
  /* MOVE txt HERE */
  position: absolute;
  top: 50%;
  left: 30%;

  /* CHANGE txt FONT STYLING HERE */
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg);
  padding: 0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.02em;
  font-weight: 400;
  opacity: 0.55;
  cursor: pointer;
  font-style: italic;
}


/* kill the default dotted focus outline that can look like tiny blinking dots */
.menu-link:focus-visible{
  outline: 2px solid #000;
  outline-offset: 6px;
}

/* Remove the stray pseudo-element that creates the tiny extra dots */
.dots::before,
.dots::after{
  content: none !important;
  display: none !important;
}

/* (Optional) also prevent pseudo-elements on the link itself */
.menu-link::before,
.menu-link::after{
  content: none !important;
  display: none !important;
}



    .dots{ display:flex; gap: var(--dot-gap); }
    .dot{
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--fg); /* black dots */
      opacity: 0.9;
    }
    .menu-link:focus-visible{
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }



    /* Scrolling strip */
/* Scrolling strip — VERTICAL */
.strip{
  width: 100%;
  height: auto;
  display: flex;
  flex-direction: column;  /* ✅ vertical */
  flex-wrap: nowrap;
  gap: 0;
  will-change: transform;
  transform: translate3d(0,0,0);
}

.start-spacer,
.end-spacer{
  flex: 0 0 var(--end-gap);
  width: 100%;
}

/* images now fill width; height follows naturally */
.strip img{
  display: block;
  width: 100%;       /* ✅ fill viewport width */
  height: auto;      /* ✅ natural height */
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ✅ COLLAGE: grid = no overlap + stays inside viewport */
.collage{
  width: 100%;
  background: var(--bg);
  box-sizing: border-box;

  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: 24px;      /* smaller = more precise vertical control */
  gap: 18px;

  padding: 24px 60px 80px;  /* keeps everything away from edges */
  overflow: hidden;         /* hard stop: nothing can spill */
}

/* ✅ images participate in layout (no absolute) */
/* was: object-fit: cover; height:100% */
.collage .p{
  position: static;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;     /* ✅ no crop */
  background: var(--bg);   /* optional: makes letterbox white */
}

/* ✅ band is a grid item (full width, no overlap) */
.band{
  grid-column: 1 / -1;
  height: 240px;
  display: flex;
  gap: 0;
  overflow: hidden;
}
.band img{
  height: 100%;
  width: auto;
  display: block;
}

/* ---- placement (edit spans to taste) ---- */

/* big top banner like your example */
.p1{ grid-column: 1 / -1; grid-row: 1 / span 12; }

/* 3 images under it */
.p2{ grid-column: 1 / 5;  grid-row: 14 / span 10; }
.p3{ grid-column: 6 / 8;  grid-row: 13 / span 12; }
.p4{ grid-column: 9 / -1; grid-row: 14 / span 10; }

/* next row / big-ish */
.p5{ grid-column: 1 / 8;  grid-row: 26 / span 14; }
.p6{ grid-column: 9 / -1; grid-row: 27 / span 12; }

/* band after */
.b1{ grid-row: 42 / span 10; }

/* a next image if you have p7 */
.p7{ grid-column: 2 / 6;  grid-row: 54 / span 10; }

/* mobile: simpler + safe */
@media (max-width: 520px){
  .collage{
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 22px;
    gap: 14px;
    padding: 18px 18px 70px;
  }

  .p1{ grid-column: 1 / -1; grid-row: 1 / span 10; }
  .p2{ grid-column: 1 / -1; grid-row: 12 / span 10; }
  .p3{ grid-column: 1 / -1; grid-row: 23 / span 10; }
  .p4{ grid-column: 1 / -1; grid-row: 34 / span 10; }
  .p5{ grid-column: 1 / -1; grid-row: 45 / span 12; }
  .p6{ grid-column: 1 / -1; grid-row: 58 / span 12; }
  .b1{ grid-row: 72 / span 9; height: 200px; }
  .p7{ grid-column: 1 / -1; grid-row: 82 / span 10; }
}
  </style>
</head>

<body>
  <div class="topbar" aria-hidden="true"></div>
  <!-- Dots link to menu.html -->
  <a class="menu-link" href="menu.html" aria-label="Open menu">
    <span class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span>
  </a>

  <div class="stage" id="stage">
    <div class="viewport">
<div class="strip" id="strip">
  <!-- small left white gap only visible at the far-right limit -->
  <span class="start-spacer" aria-hidden="true"></span>

  <!-- ✅ new moving “white picture” -->
  <div class="intro-panel">
    <div class="intro-title">репетиция</div>
    <button class="intro-txt" id="txtBtn" type="button">txt</button>
  </div>

<div class="collage">
  <!-- row 1 -->
  <img class="p p1" src="rehersal/01.jpg" alt="">
  <img class="p p2" src="rehersal/02.jpg" alt="">
  <img class="p p3" src="rehersal/03.jpg" alt="">

  <!-- row 2 -->
  <img class="p p4" src="rehersal/04.jpg" alt="">
  <img class="p p5" src="rehersal/05.jpg" alt="">
  <img class="p p6" src="rehersal/06.jpg" alt="">

  <!-- repeated strip (full width band) -->
  <div class="band b1">
    <img src="rehersal/07.jpg" alt="">
    <img src="rehersal/07.jpg" alt="">
    <img src="rehersal/07.jpg" alt="">
    <!-- ... -->
  </div>

  <!-- more scattered photos -->
  <img class="p p7" src="rehersal/08.jpg" alt="">
</div>

  <span class="end-spacer" aria-hidden="true"></span>
</div>


</div>

    </div>
  </div>

<script>
  const strip = document.getElementById('strip');
  const stage = document.getElementById('stage');

  let y = 0;

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  // ✅ bounds based on visible stage height
  function bounds(){
    const stageH = stage.clientHeight;
    const stripH = strip.scrollHeight; // total content height
    const minY = Math.min(0, stageH - stripH); // farthest up you can translate
    const maxY = 0;                             // flush top, never any top gap
    return { minY, maxY };
  }

  function apply(){
    const { minY, maxY } = bounds();
    y = clamp(y, minY, maxY);
    strip.style.transform = `translate3d(0,${y}px,0)`;
  }

  // ✅ wheel scroll vertically
  window.addEventListener('wheel', (e) => {
    // use vertical as primary, fall back to deltaX (trackpads)
    const delta = (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) ? e.deltaY : e.deltaX;

    const speed = 1.2; // tune
    y -= delta * speed;

    apply();
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('resize', apply);
  window.addEventListener('load', () => { y = 0; apply(); });

  // -------------------------
  // keep your modal code below (UNCHANGED)
  // -------------------------

  const txtBtn = document.getElementById('txtBtn');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalClose = document.getElementById('modalClose');

  function openModal(open){
    modalBackdrop.classList.toggle('open', open);
    modalBackdrop.setAttribute('aria-hidden', String(!open));
  }

  txtBtn.addEventListener('click', () => openModal(true));
  modalClose?.addEventListener('click', () => openModal(false));
  modalBackdrop?.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) openModal(false);
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') openModal(false);
  });
</script>

</body>
</html>
