<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>репетиция — Дарья Глищинская</title>

  <style>
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Light.ttf") format("truetype");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

:root{
  --bg:#fff;
  --fg:#000;

  --topbar-h:56px;

  --dot-size:5px;
  --dot-gap:6px;
  --dot-shift:-10px;

  /* layout */
  --slide-pad-x: clamp(18px, 4vw, 60px);
  --slide-pad-y: clamp(18px, 3vh, 36px);

  /* image blur while loading */
  --blur: 18px;
}

html, body{
  height: 100%;
}
body{
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden; /* we control wheel manually */
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
}

/* ✅ fixed top stripe */
.topbar{
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: var(--bg);
  z-index: 20;
}

/* ✅ menu dots */
.menu-link{
  position: fixed;
  top: calc(var(--topbar-h) / 2);
  left: 98%;
  transform: translate(-50%, -50%) translateX(var(--dot-shift));
  z-index: 30;
  padding: 8px 12px;
  text-decoration: none;
  filter: blur(3.25px);
  -webkit-tap-highlight-color: transparent;
}
.dots{ display:flex; gap: var(--dot-gap); }
.dot{
  width: var(--dot-size);
  height: var(--dot-size);
  border-radius: 50%;
  background: var(--fg);
  opacity: 0.9;
}
.menu-link:focus-visible{
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}
.dots::before,.dots::after,
.menu-link::before,.menu-link::after{
  content:none !important;
  display:none !important;
}

/* ✅ stage + viewport below topbar */
.stage{
  position: fixed;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.viewport{
  position: absolute;
  top: var(--topbar-h);
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}

/* --- SLIDES --- */
.slides{
  position: absolute;
  inset: 0;
  background: var(--bg);
}

/* one slide at a time */
.slide{
  position: absolute;
  inset: 0;
  display: none;
  background: var(--bg);
}
.slide.is-active{
  display: block;
}

/* slide inner frame controls lateral gaps (not too big on fullscreen) */
.slide-inner{
  height: 100%;
  width: 100%;
  padding: var(--slide-pad-y) var(--slide-pad-x);
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  overflow: hidden; /* never go past right edge */
}

/* optional header inside slide (like your reference) */
.slide-head{
  width: 100%;
  height: clamp(90px, 18vh, 160px);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.slide-title{
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.08em;
  font-weight: 400;
  opacity: 0.75;
  font-style: italic;
}
.slide-txt{
  margin-top: 14px;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg);
  padding: 0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.02em;
  font-weight: 400;
  opacity: 0.55;
  cursor: pointer;
  font-style: italic;
}

/* image base: never overflow; no crop */
.media{
  max-width: 100%;
  max-height: 100%;
  object-fit: contain; /* ✅ never crop */
  display: block;
}

/* blur while loading */
.media.is-loading{
  filter: blur(var(--blur));
  transform: translateZ(0);
}

/* --- Slide 1 (single panorama) --- */
.slide--single .single-wrap{
  width: 100%;
  flex: 1 1 auto;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* --- Slide 2 (three across) --- */
.triptych{
  width: 100%;
  flex: 1 1 auto;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2vw, 22px);

  align-items: center;
  justify-items: center;
  overflow: hidden;
}
.triptych .media{
  width: 100%;
  height: auto;
  max-height: 100%;
}

/* responsive: stack on narrow screens */
@media (max-width: 720px){
  .triptych{
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .slide-head{
    height: 120px;
  }
}
  </style>
</head>

<body>
  <div class="topbar" aria-hidden="true"></div>

  <a class="menu-link" href="menu.html" aria-label="Open menu">
    <span class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span>
  </a>

  <div class="stage">
    <div class="viewport">
      <div class="slides" id="slides">

        <!-- SLIDE 1 -->
        <section class="slide slide--single is-active" data-slide>
          <div class="slide-inner">
            <div class="slide-head">
              <div style="text-align:center">
                <div class="slide-title">репетиция</div>
                <button class="slide-txt" id="txtBtn" type="button">txt</button>
              </div>
            </div>

            <div class="single-wrap">
              <img class="media" src="rehersal/01.jpg" alt="">
            </div>
          </div>
        </section>

        <!-- SLIDE 2 -->
        <section class="slide" data-slide>
          <div class="slide-inner">
            <div class="triptych">
              <img class="media" src="rehersal/02.jpg" alt="">
              <img class="media" src="rehersal/03.jpg" alt="">
              <img class="media" src="rehersal/04.jpg" alt="">
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <script>
(() => {
  const slides = Array.from(document.querySelectorAll('[data-slide]'));
  let index = 0;
  let locked = false;

  function setActive(i){
    index = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle('is-active', k === index));
    // kick blur management on the active slide
    hydrateSlide(slides[index]);
  }

  // ---- Blur until loaded (per image) ----
  function setLoading(img, on){
    img.classList.toggle('is-loading', on);
  }

  function hydrateSlide(slideEl){
    const imgs = Array.from(slideEl.querySelectorAll('img'));
    imgs.forEach(img => {
      // if already handled, skip
      if (img.dataset.bound === '1') return;
      img.dataset.bound = '1';

      // start blurred if not complete yet
      setLoading(img, !img.complete);

      img.addEventListener('load', () => setLoading(img, false), { passive: true });
      img.addEventListener('error', () => {
        // hide broken images (and keep layout sane)
        console.warn('Missing image:', img.getAttribute('src'));
        img.style.display = 'none';
      }, { passive: true });
    });
  }

  // hydrate first slide immediately
  hydrateSlide(slides[0]);

  // ---- Instant slide switching on wheel / trackpad ----
  function next(){ setActive(index + 1); }
  function prev(){ setActive(index - 1); }

  window.addEventListener('wheel', (e) => {
    // prevent native scroll
    e.preventDefault();

    if (locked) return;

    // Determine dominant gesture axis:
    const dy = e.deltaY;
    const dx = e.deltaX;
    const dominant = (Math.abs(dy) >= Math.abs(dx)) ? dy : dx;

    // rules:
    // wheel down / swipe up => dy > 0 => next
    // swipe left => dx > 0 => next
    // wheel up / swipe down => prev
    if (dominant > 0) next();
    else if (dominant < 0) prev();

    // tiny lock to avoid accidental double-steps on inertial wheels
    locked = true;
    setTimeout(() => { locked = false; }, 120);
  }, { passive: false });

  // Optional: keyboard arrows
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next();
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') prev();
  });

  // Optional: touch swipe (mobile)
  let sx = 0, sy = 0;
  window.addEventListener('touchstart', (e) => {
    if (!e.touches || !e.touches[0]) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    if (!sx && !sy) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    const dx = sx - t.clientX;
    const dy = sy - t.clientY;

    // swipe up OR swipe left => next
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 40) next();
      else if (dx < -40) prev();
    } else {
      if (dy > 40) next();
      else if (dy < -40) prev();
    }

    sx = 0; sy = 0;
  }, { passive: true });

})();
  </script>
</body>
</html>
