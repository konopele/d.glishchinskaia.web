<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>репетиция — Дарья Глищинская</title>

  <style>
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Light.ttf") format("truetype");
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face{
  font-family: "Montserrat";
  src: url("fonts/montserrat/Montserrat-Italic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

:root{
  --bg:#fff;
  --fg:#000;

  --topbar-h:56px;

  --dot-size:5px;
  --dot-gap:6px;
  --dot-shift:-10px;

  /* layout */
  --slide-pad-x: clamp(18px, 4vw, 60px);
  --slide-pad-y: clamp(18px, 3vh, 36px);

  /* image blur while loading */
  --blur: 18px;
}

html, body{
  height: 100%;
}
body{
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden; /* we control wheel manually */
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
}

/* ✅ fixed top stripe */
.topbar{
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: var(--bg);
  z-index: 20;
}

/* ✅ menu dots */
.menu-link{
  position: fixed;
  top: calc(var(--topbar-h) / 2);
  left: 98%;
  transform: translate(-50%, -50%) translateX(var(--dot-shift));
  z-index: 30;
  padding: 8px 12px;
  text-decoration: none;
  filter: blur(3.25px);
  -webkit-tap-highlight-color: transparent;
}
.dots{ display:flex; gap: var(--dot-gap); }
.dot{
  width: var(--dot-size);
  height: var(--dot-size);
  border-radius: 50%;
  background: var(--fg);
  opacity: 0.9;
}
.menu-link:focus-visible{
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}
.dots::before,.dots::after,
.menu-link::before,.menu-link::after{
  content:none !important;
  display:none !important;
}

/* ✅ stage + viewport below topbar */
.stage{
  position: fixed;
  inset: 0;
  background: var(--bg);
  overflow: hidden;
}
.viewport{
  position: absolute;
  top: var(--topbar-h);
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}

/* --- SLIDES --- */
.slides{
  position: absolute;
  inset: 0;
  background: var(--bg);
}

/* one slide at a time */
.slide{
  position: absolute;
  inset: 0;
  display: none;
  background: var(--bg);
}
.slide.is-active{
  display: block;
}

/* slide inner frame controls lateral gaps (not too big on fullscreen) */
.slide-inner{
  height: 100%;
  width: 100%;
  padding: var(--slide-pad-y) var(--slide-pad-x);
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  overflow: hidden; /* never go past right edge */
}

/* optional header inside slide (like your reference) */
.slide-head{
  width: 100%;
  height: clamp(90px, 18vh, 160px);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.slide-title{
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.08em;
  font-weight: 400;
  opacity: 0.75;
  font-style: italic;
}
.slide-txt{
  margin-top: 14px;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg);
  padding: 0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.02em;
  font-weight: 400;
  opacity: 0.55;
  cursor: pointer;
  font-style: italic;
}

/* image base: never overflow; no crop */
.media{
  max-width: 100%;
  max-height: 100%;
  object-fit: contain; /* ✅ never crop */
  display: block;
}

/* blur while loading */
.media.is-loading{
  filter: blur(var(--blur));
  transform: translateZ(0);
}

/* --- Slide 1 (single panorama) --- */
.slide--single .single-wrap{
  width: 100%;
  flex: 1 1 auto;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* --- Slide 2 (three across) --- */
.triptych{
  width: 100%;
  flex: 1 1 auto;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2vw, 22px);

  align-items: center;
  justify-items: center;
  overflow: hidden;
}
.triptych .media{
  width: 100%;
  height: auto;
  max-height: 100%;
}

/* --- Slide 2 layout: big-left + triple-right --- */
.slide--duo3 .duo3{
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1.05fr 1fr;              /* left slightly wider */
  gap: clamp(18px, 4vw, 54px);
  align-items: center;
  overflow: hidden;
}

.slide--duo3 .left{
  height: 100%;
  display: grid;
  align-items: center;
  overflow: hidden;
}
.slide--duo3 .left .media{
  width: 100%;
  height: 100%;
  max-height: 100%;
  object-fit: contain;                            /* ✅ no crop */
}

.slide--duo3 .right{
  height: 100%;
  display: grid;
  align-items: center;                            /* center vertically */
  overflow: hidden;
}

.slide--duo3 .triples{
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2.2vw, 26px);
  align-items: center;
  justify-items: center;
}

/* each repeated image is a “card” with fixed-ish height, no crop */
.slide--duo3 .triples .media{
  width: 100%;
  height: min(60vh, 520px);                       /* controls the 3-up size */
  object-fit: contain;                            /* ✅ no crop */
}

/* responsive: stack right under left on narrow screens */
@media (max-width: 900px){
  .slide--duo3 .duo3{
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .slide--duo3 .triples{
    grid-template-columns: 1fr;
  }
  .slide--duo3 .triples .media{
    height: auto;
  }
}

/* =========================
   SLIDE 3: one photo top-right
   ========================= */
.slide--solo-tr .solo-tr{
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}
.slide--solo-tr .solo-tr .media{
  position: absolute;
  top: clamp(18px, 4vh, 48px);
  right: clamp(18px, 4vw, 70px);
  width: min(320px, 34vw);
  height: auto;
  max-height: 60vh;
  object-fit: contain; /* no crop */
}

/* =========================
   SLIDE 4: tiled background + overlay portrait
   (background uses cover to fill, like your reference)
   ========================= */
.slide--pattern .pattern{
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}
.slide--pattern .pattern-bg{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;          /* fills the slide like your screenshot */
  display: block;
}
.slide--pattern .pattern-overlay{
  position: absolute;
  top: 50%;
  left: 70%;                  /* slightly right of center */
  transform: translate(-50%, -50%);
  width: min(320px, 26vw);
  max-height: 70vh;
  height: auto;
  object-fit: contain;        /* no crop */
  border: 2px solid rgba(0,0,0,0.35);
  background: rgba(255,255,255,0.01);
}

/* =========================
   SLIDE 5: left single + right triple
   ========================= */
.slide--left1right3 .lr13{
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: clamp(18px, 4vw, 54px);
  align-items: center;
  overflow: hidden;
}
.slide--left1right3 .lr13-left{
  height: 100%;
  display: grid;
  align-items: center;
  overflow: hidden;
}
.slide--left1right3 .lr13-left .media{
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.slide--left1right3 .lr13-right{
  height: 100%;
  display: grid;
  align-items: center;
  overflow: hidden;
}
.slide--left1right3 .lr13-right-grid{
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 2.2vw, 26px);
  align-items: center;
  justify-items: center;
}
.slide--left1right3 .lr13-right-grid .media{
  width: 100%;
  height: min(58vh, 520px);
  object-fit: contain;
}

/* =========================
   SLIDE 7: three same + one on the right
   ========================= */
.slide--threeplusone .tpo{
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1.05fr;
  gap: clamp(14px, 2.4vw, 28px);
  align-items: start;
  overflow: hidden;
}
.slide--threeplusone .tpo .sq{
  width: 100%;
  height: min(42vh, 360px);
  object-fit: contain; /* no crop */
}
.slide--threeplusone .tpo .right{
  width: 100%;
  height: min(48vh, 420px);
  object-fit: contain; /* no crop */
  justify-self: end;
  align-self: start;
}

/* responsive */
@media (max-width: 900px){
  .slide--left1right3 .lr13{
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .slide--left1right3 .lr13-right-grid{
    grid-template-columns: 1fr;
  }
  .slide--left1right3 .lr13-right-grid .media{
    height: auto;
  }

  .slide--threeplusone .tpo{
    grid-template-columns: 1fr;
  }
  .slide--threeplusone .tpo .sq,
  .slide--threeplusone .tpo .right{
    height: auto;
  }

  .slide--solo-tr .solo-tr .media{
    right: 18px;
    width: min(320px, 70vw);
  }

  .slide--pattern .pattern-overlay{
    left: 62%;
    width: min(320px, 56vw);
  }
}

/* responsive: stack on narrow screens */
@media (max-width: 720px){
  .triptych{
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .slide-head{
    height: 120px;
  }
}
  </style>
</head>

<body>
  <div class="topbar" aria-hidden="true"></div>

  <a class="menu-link" href="menu.html" aria-label="Open menu">
    <span class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span>
  </a>

  <div class="stage">
    <div class="viewport">
      <div class="slides" id="slides">

        <!-- SLIDE 1 -->
        <section class="slide slide--single is-active" data-slide>
          <div class="slide-inner">
            <div class="slide-head">
              <div style="text-align:center">
                <div class="slide-title">репетиция</div>
                <button class="slide-txt" id="txtBtn" type="button">txt</button>
              </div>
            </div>

            <div class="single-wrap">
              <img class="media" src="rehersal/01.jpg" alt="">
            </div>
          </div>
        </section>

<!-- SLIDE 2 (big-left + 3 copies right) -->
<section class="slide slide--duo3" data-slide>
  <div class="slide-inner">
    <div class="duo3">
      <div class="left">
        <img class="media" src="rehersal/06.jpg" alt="">
      </div>

      <div class="right">
        <div class="triples">
          <img class="media" src="rehersal/07.jpg" alt="">
          <img class="media" src="rehersal/07.jpg" alt="">
          <img class="media" src="rehersal/07.jpg" alt="">
        </div>
      </div>
    </div>
  </div>
</section>

<!-- SLIDE 3: one photo top-right -->
<section class="slide slide--solo-tr" data-slide>
  <div class="slide-inner">
    <div class="solo-tr">
      <img class="media" src="rehersal/04.jpg" alt="">
    </div>
  </div>
</section>

<!-- SLIDE 4: tiled background + overlay -->
<section class="slide slide--pattern" data-slide>
  <div class="slide-inner">
    <div class="pattern">
      <img class="media pattern-bg" src="rehersal/08.png" alt="">
      <img class="media pattern-overlay" src="rehersal/09.jpg" alt="">
    </div>
  </div>
</section>

<!-- SLIDE 5: left single + right triple -->
<section class="slide slide--left1right3" data-slide>
  <div class="slide-inner">
    <div class="lr13">
      <div class="lr13-left">
        <img class="media" src="rehersal/03.jpg" alt="">
      </div>
      <div class="lr13-right">
        <div class="lr13-right-grid">
          <img class="media" src="rehersal/02.jpg" alt="">
          <img class="media" src="rehersal/02.jpg" alt="">
          <img class="media" src="rehersal/02.jpg" alt="">
        </div>
      </div>
    </div>
  </div>
</section>

<!-- SLIDE 7: three same + one on the right -->
<section class="slide slide--threeplusone" data-slide>
  <div class="slide-inner">
    <div class="tpo">
      <img class="media sq" src="rehersal/15.jpg" alt="">
      <img class="media sq" src="rehersal/15.jpg" alt="">
      <img class="media sq" src="rehersal/15.jpg" alt="">
      <img class="media right" src="rehersal/14.jpg" alt="">
    </div>
  </div>
</section>

      </div>
    </div>
  </div>

  <script>
(() => {
  const slides = Array.from(document.querySelectorAll('[data-slide]'));
  let index = 0;
  let locked = false;

  function setActive(i){
    index = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle('is-active', k === index));
    // kick blur management on the active slide
    hydrateSlide(slides[index]);
  }

  // ---- Blur until loaded (per image) ----
  function setLoading(img, on){
    img.classList.toggle('is-loading', on);
  }

  function hydrateSlide(slideEl){
    const imgs = Array.from(slideEl.querySelectorAll('img'));
    imgs.forEach(img => {
      // if already handled, skip
      if (img.dataset.bound === '1') return;
      img.dataset.bound = '1';

      // start blurred if not complete yet
      setLoading(img, !img.complete);

      img.addEventListener('load', () => setLoading(img, false), { passive: true });
      img.addEventListener('error', () => {
        // hide broken images (and keep layout sane)
        console.warn('Missing image:', img.getAttribute('src'));
        img.style.display = 'none';
      }, { passive: true });
    });
  }

  // hydrate first slide immediately
  hydrateSlide(slides[0]);

  // ---- Instant slide switching on wheel / trackpad ----
  function next(){ setActive(index + 1); }
  function prev(){ setActive(index - 1); }

  window.addEventListener('wheel', (e) => {
    // prevent native scroll
    e.preventDefault();

    if (locked) return;

    // Determine dominant gesture axis:
    const dy = e.deltaY;
    const dx = e.deltaX;
    const dominant = (Math.abs(dy) >= Math.abs(dx)) ? dy : dx;

    // rules:
    // wheel down / swipe up => dy > 0 => next
    // swipe left => dx > 0 => next
    // wheel up / swipe down => prev
    if (dominant > 0) next();
    else if (dominant < 0) prev();

    // tiny lock to avoid accidental double-steps on inertial wheels
    locked = true;
    setTimeout(() => { locked = false; }, 120);
  }, { passive: false });

  // Optional: keyboard arrows
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next();
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') prev();
  });

  // Optional: touch swipe (mobile)
  let sx = 0, sy = 0;
  window.addEventListener('touchstart', (e) => {
    if (!e.touches || !e.touches[0]) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    if (!sx && !sy) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    const dx = sx - t.clientX;
    const dy = sy - t.clientY;

    // swipe up OR swipe left => next
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 40) next();
      else if (dx < -40) prev();
    } else {
      if (dy > 40) next();
      else if (dy < -40) prev();
    }

    sx = 0; sy = 0;
  }, { passive: true });

})();
  </script>
</body>
