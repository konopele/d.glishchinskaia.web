<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DARIA GLISHCHINSKAIA</title>

  <style>
    .secondary-topstrip{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;              /* choose your strip height */
      background: #fff;          /* solid white */
      opacity: 1;                /* explicitly non-transparent */
      z-index: 999999;           /* above everything */
      display: flex;
      align-items: center;
      justify-content: left; /* dots on the right */
      padding: 0 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.08); /* optional divider */
    }

    .secondary-content{
      padding-top: 56px; /* match header height so content doesn't go under it */
    }

    .kebab{
      background: transparent;
      border: 0;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    :root{
      --bg:#fff;
      --fg:#000;

      --top-gap:46px;     /* space above photos for dots */
      --dot-size:5px;
      --dot-gap:6px;
      --dot-shift:-10px;  /* negative = shift left */

      --edge-zone:80px;   /* px near top/bottom edges that triggers scrolling */
      --max-speed:18;     /* px per frame */
      --page-pad:0px;     /* keep 0 for flush look */
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root{
      /* ... */
      --side-pad: 56px; /* distance from left/right borders */
      --top-pad: 0px;   /* keep 0 unless you also want top/bottom padding */
    }

    /* Whole stage (no frame) */
    .stage{
      position: fixed;
      top: var(--top-pad);
      bottom: var(--top-pad);
      left: var(--side-pad);
      right: var(--side-pad);
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== DOTS (UNCHANGED) ===== */
    .menu-link{
      position: fixed;
      top: 12px;

      /* 1/4 of the page width */
      left: 25%;

      /* keep the small left shift you already liked */
      transform: translateX(var(--dot-shift));

      z-index: 10;
      padding: 8px 12px;
      text-decoration: none;

      /* slight blur */
      filter: blur(0.65px);
      opacity: 0.8;

      -webkit-tap-highlight-color: transparent;
    }

    /* kill the default dotted focus outline that can look like tiny blinking dots */
    .menu-link:focus-visible{
      outline: 2px solid #000;
      outline-offset: 6px;
    }

    /* Remove the stray pseudo-element that creates the tiny extra dots */
    .dots::before,
    .dots::after{
      content: none !important;
      display: none !important;
    }

    /* (Optional) also prevent pseudo-elements on the link itself */
    .menu-link::before,
    .menu-link::after{
      content: none !important;
      display: none !important;
    }

    .dots{ display:flex; gap: var(--dot-gap); }
    .dot{
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      background: var(--fg); /* black dots */
      opacity: 0.9;
    }
    .menu-link:focus-visible{
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }
    /* ===== END DOTS ===== */

    /* Reserve top band, photos below */
    .viewport{
      position:absolute;
      inset: 0;
      padding-top: var(--top-gap);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Scrolling strip (VERTICAL) */
/* Reserve top band, photos below (keep yours) */
.viewport{
  position:absolute;
  inset: 0;
  padding-top: var(--top-gap);
  box-sizing: border-box;
  overflow: hidden;
}

/* ===== NEW: editorial grid strip ===== */
/* --- LAYOUT: screenshot grid --- */
.strip{
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 28px;
  padding: 26px 0 80px;       /* top + bottom breathing room */
  align-content: start;
  will-change: transform;
  transform: translate3d(0,0,0);
}

/* Each tile controls its crop */
.item{
  width: 100%;
  overflow: hidden;
  background: transparent;
}

.item img{
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ====== PLACEMENT MAP (matches your screenshot) ====== */

/* 1) Top panorama */
.hero{
  grid-column: 1 / -1;
  aspect-ratio: 16 / 5;
}

/* 2) Staggered smalls under hero:
      left medium, center portrait, right column two portraits stacked */
.s2-left   { grid-column: 1 / span 6;  aspect-ratio: 4 / 3; }
.s2-center { grid-column: 6 / span 3;  aspect-ratio: 2 / 3; }
.s2-r-top  { grid-column: 10 / span 3; aspect-ratio: 2 / 3; }
.s2-r-bot  { grid-column: 10 / span 3; aspect-ratio: 2 / 3; }

/* 3) Big left + right portrait (the “main pair”) */
.big-left  { grid-column: 1 / span 7;  aspect-ratio: 4 / 5; }
.big-right { grid-column: 9 / span 4;  aspect-ratio: 3 / 4; }

/* 4) Full-width contact sheet band + inset portrait on the right */
.band{
  grid-column: 1 / -1;
  aspect-ratio: 16 / 6;       /* wide strip */
}
.band-inset{
  grid-column: 9 / span 4;    /* sits over the band on the right */
  aspect-ratio: 3 / 4;
  z-index: 2;
}

/* 5) Three scattered mid row */
.mid-left  { grid-column: 1 / span 4;  aspect-ratio: 4 / 3; }
.mid-center{ grid-column: 5 / span 4;  aspect-ratio: 3 / 4; }
.mid-right { grid-column: 10 / span 3; aspect-ratio: 3 / 4; }
.mid-right2{ grid-column: 10 / span 3; aspect-ratio: 3 / 4; }

/* 6) Row of 4 headshots */
.head{ grid-column: span 3; aspect-ratio: 1 / 1; }

/* 7) Bottom two big images */
.bottom-left  { grid-column: 1 / span 6; aspect-ratio: 4 / 3; }
.bottom-right { grid-column: 7 / span 6; aspect-ratio: 4 / 3; }


  </style>
</head>

<body>
  <!-- moved from <head> to <body> (valid HTML) -->

<div class="strip" id="strip">

<script>
  const strip = document.getElementById('strip');

  // current translateY (0 = top)
  let y = 0;

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function bounds(){
    const viewportH = document.documentElement.clientHeight;
    const stripH = strip.scrollHeight;
    const minY = Math.min(0, viewportH - stripH); // negative if content taller than viewport
    const maxY = 0;
    return { minY, maxY };
  }

  function apply(){
    strip.style.transform = `translate3d(0,${y}px,0)`;
  }

  // Wheel / trackpad scroll
  window.addEventListener('wheel', (e) => {
    // prevent the page from scrolling normally
    e.preventDefault();

    // deltaY: + means scroll down (content should move up => y decreases)
    y -= e.deltaY;

    const { minY, maxY } = bounds();
    y = clamp(y, minY, maxY);
    apply();
  }, { passive: false });

  // Keep position valid on resize
  window.addEventListener('resize', () => {
    const { minY, maxY } = bounds();
    y = clamp(y, minY, maxY);
    apply();
  });

  apply();
</script>
